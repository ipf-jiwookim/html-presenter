<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>샘플 발표</title>
<style>
body{margin:0;overflow:hidden;font-family:-apple-system,sans-serif}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;opacity:0;transition:opacity .35s}
.slide.on{opacity:1}
h1{font-size:9vmin;margin:0}
p{font-size:3.5vmin;opacity:.85;margin:0}
#pageno{position:fixed;right:24px;bottom:18px;color:#fff;opacity:.6;font-size:2.5vmin;z-index:9}
</style>
</head>
<body>
<div class="slide" style="background:linear-gradient(135deg,#1a2980,#26d0ce)"><h1>슬라이드 1</h1><p>AI가 만든 HTML 발표 자료라고 가정</p></div>
<div class="slide" style="background:linear-gradient(135deg,#41295a,#2f0743)"><h1>슬라이드 2</h1><p>← → 키로 이동하는 전형적인 구조</p></div>
<div class="slide" style="background:linear-gradient(135deg,#134e5e,#71b280)"><h1>슬라이드 3</h1><p>발표자 도구 동기화 테스트</p></div>
<div class="slide" style="background:linear-gradient(135deg,#cb356b,#bd3f32)"><h1>슬라이드 4</h1><p>미리보기는 항상 한 단계 앞</p></div>
<div class="slide" style="background:linear-gradient(135deg,#141e30,#243b55)"><h1>끝</h1><p>수고하셨습니다 🎉</p></div>
<div id="pageno"></div>
<script>
let i=0;
const s=[...document.querySelectorAll('.slide')];
function show(){s.forEach((el,j)=>el.classList.toggle('on',j===i));document.getElementById('pageno').textContent=(i+1)+' / '+s.length}
document.addEventListener('keydown',e=>{
  const k=e.keyCode||0;
  if(e.key==='ArrowRight'||e.key===' '||k===39)i=Math.min(i+1,s.length-1);
  else if(e.key==='ArrowLeft'||k===37)i=Math.max(i-1,0);
  else return;
  show();
});
show();
</script>
</body>
</html>
